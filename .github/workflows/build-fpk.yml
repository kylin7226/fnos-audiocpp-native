name: build-fnos-fpk

on:
  workflow_dispatch:
    inputs:
      audiocpp_ref:
        description: '上游标准正式发布 tag，例如 v0.9.4'
        default: 'v0.9.4'
      revision:
        description: '三位修订号；留空使用已有最大修订号加一'
        default: ''
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      base:
        type: string
        required: true
      revision:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: audiocpp-publication
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/check.yml
  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.vars.outputs.kind }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
    steps:
      - name: Checkout packager repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version and source ref
        id: vars
        env:
          IN_REF: ${{ inputs.audiocpp_ref }}
          IN_REV: ${{ inputs.revision }}
          CALL_BASE: ${{ inputs.base }}
        run: python3 tools/release.py resolve
      - name: Check existing release without replacing assets
        id: existing
        if: steps.vars.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag_name }}
        run: python3 tools/release.py inspect
      - name: Verify upstream formal release
        if: steps.existing.outputs.build != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.vars.outputs.ref }}
        run: |
          gh api "repos/0xShug0/audio.cpp/releases/tags/$REF" > "$RUNNER_TEMP/upstream-release.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert not d["draft"] and not d["prerelease"], "upstream is not a formal release"' "$RUNNER_TEMP/upstream-release.json"
      - name: Checkout audio.cpp source
        if: steps.existing.outputs.build != 'false'
        uses: actions/checkout@v4
        with:
          repository: 0xShug0/audio.cpp
          ref: ${{ steps.vars.outputs.ref }}
          path: audio.cpp-src
          fetch-depth: 1
          persist-credentials: false
      - name: Build and smoke-test in Debian 12
        if: steps.existing.outputs.build != 'false'
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -e SRC_DIR=/work/audio.cpp-src -e REPO_DIR=/work \
            -e OUT_TGZ=/work/dist/app.tgz -e AUDIOCPP_VERSION="$VERSION" \
            -e JOBS="$(nproc)" debian:12 bash /work/scripts/build-audiocpp.sh
      - name: Pack and verify FPK
        if: steps.existing.outputs.build != 'false'
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          bash scripts/pack-fpk.sh app dist/app.tgz "$VERSION" x86 dist
          python3 tools/check_payload.py --fpk "dist/audiocpp_${VERSION}_x86.fpk" --version "$VERSION"
      - name: Upload validated artifact
        if: steps.existing.outputs.build != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: audiocpp-fnos-fpk-${{ steps.vars.outputs.version }}
          path: dist/*.fpk
          if-no-files-found: error
      - name: Publish immutable release
        if: steps.vars.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag_name }}
        run: python3 tools/release.py publish

  # GITHUB_TOKEN-created releases do not trigger another release workflow.
  update-moo:
    needs: build
    if: needs.build.outputs.kind == 'release'
    uses: ./.github/workflows/moo-json.yml
    with:
      tag: ${{ needs.build.outputs.tag_name }}
