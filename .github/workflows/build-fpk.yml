name: build-fnos-fpk

# 在 Debian 12（glibc 2.36，与 fnOS 一致）里编译 audio.cpp Vulkan 版，
# 再打包成可在飞牛 fnOS 应用中心直接安装的 .fpk（原生二进制，不用容器）。
#
# ── 版本号方案：<上游 audio.cpp 版本>-<本打包项目修订号(三位)>，例如 0.9.4-001 ──
#   · 上游版本锁正式发布 tag（如 v0.9.4），保证源码可复现、可追溯；
#   · 修订号区分「同一上游版本、本仓库多次打包」——改了构建脚本/配置/资产后重打包，
#     就递增 -001、-002…。这也是 Synology/fnOS 系包管理惯用的 version-revision 形式，
#     fnOS 会据此判定升级。manifest 版本、fpk 文件名、Release、moo.json 全用它。
#
# ── 两种触发策略 ──
#   A) 推送 tag v*（正式发布，推荐用带修订号的 tag，如 v0.9.4-001）
#      → 正式构建：产出 .fpk，上传 artifact，并创建 Release 附带 .fpk。
#        tag 名即版本；上游源码 ref 取 tag 的 base 部分（v0.9.4-001 → 上游 v0.9.4）。
#        兼容不带修订号的老 tag（v0.9.4 → 视为 0.9.4-000）。
#   B) 手动触发（Actions → build-fnos-fpk → Run workflow，在 main 分支上）
#      → 预览构建：只产出 artifact，不建 Release、不进 moo 索引，用于验证改动能否编过。
#        修订号可留空自动按现有 v<base>-NNN tag 数递增，或手填三位数。
#
# 发布正式版的完整流程：本地 `git tag v0.9.4-001 && git push origin v0.9.4-001`
# → 策略 A 构建并创建 Release → Release published 触发 moo-json.yml 写回市场索引。

on:
  workflow_dispatch:
    inputs:
      audiocpp_ref:
        description: '上游 audio.cpp 版本（正式发布 tag，如 v0.9.4）'
        required: false
        default: 'v0.9.4'
      revision:
        description: '打包修订号（三位，如 001）；留空则按现有同名 tag 数自动递增'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.vars.outputs.kind }}
    steps:
      - name: Checkout packager repo
        uses: actions/checkout@v4
        with:
          # 需要完整 tag 列表来自动推算修订号（策略 B 留空时）
          fetch-depth: 0

      - name: Resolve version & source ref
        id: vars
        env:
          IN_REF: ${{ inputs.audiocpp_ref }}
          IN_REV: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 策略 A：tag 名即版本。tag 形如 0.9.4-001 或老式 0.9.4。
            tag="${GITHUB_REF#refs/tags/v}"
            base="${tag%%-*}"                       # 上游版本，如 0.9.4
            if [[ "$tag" == *-* ]]; then rev="${tag##*-}"; else rev="000"; fi
            kind="release"
          else
            # 策略 B：main 手动预览。base 取输入的上游版本（去掉可能的 v 前缀）。
            base="${IN_REF#v}"
            rev="${IN_REV}"
            if [[ -z "$rev" ]]; then
              n=$(git tag -l "v${base}-[0-9][0-9][0-9]" | wc -l | tr -d ' ')
              rev=$(printf "%03d" "$n")
            fi
            kind="preview"
          fi
          [[ "$rev" =~ ^[0-9]{3}$ ]] || { echo "::error::修订号必须是三位数字，得到：'$rev'" >&2; exit 1; }
          version="${base}-${rev}"
          ref="v${base}"
          {
            echo "ref=${ref}"
            echo "version=${version}"
            echo "kind=${kind}"
          } >> "$GITHUB_OUTPUT"
          echo "上游 ref=${ref} · 打包版本=${version} · 类型=${kind}"

      # 上游 audio.cpp 是公开仓库，普通 checkout 即可；不拉子模块
      # （唯一子模块是 WebUI 前端，纯 API 构建用不到，官方 release 也不拉）。
      - name: Checkout audio.cpp source
        uses: actions/checkout@v4
        with:
          repository: 0xShug0/audio.cpp
          ref: ${{ steps.vars.outputs.ref }}
          path: audio.cpp-src
          fetch-depth: 1

      # 关键：在 debian:12 容器里编译。容器 glibc 2.36 与 fnOS 一致，但 audio.cpp
      # 要求 GCC≥13（bookworm 只有 gcc-12，earshot_vad 的 avx2 pragma 会编译失败），
      # 故 build-audiocpp.sh 在容器内装 conda-forge gcc-13——它自带 glibc 2.34 的
      # sysroot，产物只要求 GLIBC≤2.34（<fnOS 2.36），并把 conda 的 libstdc++/libgcc_s/
      # libgomp 打进 bin/（rpath=$ORIGIN）以满足 GLIBCXX_3.4.32。CI 走官方 conda-forge
      # 通道（runner 在海外，快）；本地 CN 可用 AUDIOCPP_CONDA_CHANNEL/AUDIOCPP_MINICONDA_URL 切清华镜像。
      # 采用官方 linux-vulkan-**portable** 配方（NATIVE_CPU=OFF + CPU_ALL_VARIANTS=ON），
      # 避免按 runner CPU 做 -march=native 导致在用户 NAS 上 SIGILL。
      - name: Build audiocpp (Vulkan) in debian:12
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -e SRC_DIR=/work/audio.cpp-src \
            -e REPO_DIR=/work \
            -e OUT_TGZ=/work/dist/app.tgz \
            -e AUDIOCPP_VERSION="${{ steps.vars.outputs.version }}" \
            -e JOBS="$(nproc)" \
            debian:12 \
            bash /work/scripts/build-audiocpp.sh

      - name: Pack .fpk
        run: |
          # 上一步 docker 以 root 身份创建 dist/ 和 app.tgz，而本步以非 root 的 runner
          # 用户运行——不改属主则 pack-fpk.sh 无法把 .fpk 写进 dist/（tar 报 Permission
          # denied，退出码 2）。GitHub 托管 runner 有免密 sudo，这里把 dist/ 交还 runner。
          sudo chown -R "$(id -u):$(id -g)" dist
          chmod +x scripts/*.sh
          bash scripts/pack-fpk.sh app dist/app.tgz "${{ steps.vars.outputs.version }}" x86 dist

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiocpp-fnos-fpk-${{ steps.vars.outputs.version }}
          path: dist/*.fpk
          if-no-files-found: error

      # 仅策略 A（推 tag）建 Release；策略 B（手动预览）到此为止，只留 artifact。
      - name: Attach to Release (on tag)
        if: steps.vars.outputs.kind == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: audio.cpp fnOS fpk ${{ steps.vars.outputs.version }}
          files: dist/*.fpk
          generate_release_notes: true

  # 上面的 Release 由 softprops 用 GITHUB_TOKEN 创建，而 GitHub 不会为 GITHUB_TOKEN 触发的
  # 事件再启动新 workflow，故 moo-json.yml 的 `on: release` 对自动发布永不触发。这里在同一
  # run 内用 workflow_call 直接调用它写回市场索引——链式调用不受该限制。仅正式 Release 触发。
  update-moo:
    needs: build
    if: needs.build.outputs.kind == 'release'
    uses: ./.github/workflows/moo-json.yml
    with:
      tag: ${{ github.ref_name }}
