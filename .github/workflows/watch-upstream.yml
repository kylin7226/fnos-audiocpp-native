name: watch-upstream-release

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      base:
        description: '上游标准正式版本 X.Y.Z；留空自动选择最新标准正式 Release'
        required: false
        default: ''
      force:
        description: '递增修订号重新构建，不替换已有附件'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.detect.outputs.action }}
      base: ${{ steps.detect.outputs.base }}
      rev: ${{ steps.detect.outputs.rev }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check complete publication state
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_BASE: ${{ inputs.base }}
          IN_FORCE: ${{ inputs.force }}
        run: python3 tools/release.py detect

  build-release:
    needs: check
    if: needs.check.outputs.action == 'build'
    uses: ./.github/workflows/build-fpk.yml
    with:
      base: ${{ needs.check.outputs.base }}
      revision: ${{ needs.check.outputs.rev }}

  repair-moo:
    needs: check
    if: needs.check.outputs.action == 'sync'
    uses: ./.github/workflows/moo-json.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
