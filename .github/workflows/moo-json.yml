name: Update moo.json

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的正式 release tag，例如 v0.9.4-002'
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: moo-json-main
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      FPK_DIR: ${{ github.workspace }}/release-assets
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate tag and download verified FPK
        run: python3 tools/release.py download
      - name: Check package structure and version
        run: python3 tools/check_payload.py --fpk "$FPK_DIR/audiocpp_${TAG#v}_x86.fpk" --version "${TAG#v}"
      - name: Update moo.json with vendored updater
        run: |
          python3 tools/update_moo_json.py --file moo.json --tag "$TAG" \
            --fpk "$FPK_DIR"/*.fpk --keep 2
      - name: Commit if changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet -- moo.json; then
            exit 0
          fi
          git add moo.json
          git commit -m "chore(moo.json): 同步 $TAG 版本节点"
          git push origin HEAD:main || {
            printf '%s\n' '::error::main 在同步期间发生变化或受保护；请重跑 Moo 更新，重新基于最新索引计算。'
            exit 1
          }
